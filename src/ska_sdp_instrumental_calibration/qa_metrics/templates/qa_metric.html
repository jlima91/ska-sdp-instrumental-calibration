<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
{% include "qa_metric.css" %}
</style>
</head>
<body>
<header>
<h1>{{ title }}</h1>
<div class="toolbar">
  <button onclick="setAllSectionsOpen(true)">Expand all</button>
  <button onclick="setAllSectionsOpen(false)">Collapse all</button>
</div>
</header>
<main>
  {% for section_title in section_titles %}
  <details open><summary>{{ section_title }}</summary><div></div></details>
  {% endfor %}
</main>
<script>
function setAllSectionsOpen(open) {
  document.querySelectorAll("details").forEach(function (section) {
    section.open = open;
  });
}
</script>
</body>
</html>
