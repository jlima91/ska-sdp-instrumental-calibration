<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
{% include "qa_metric.css" %}
</style>
</head>
<body>
<header>
<h1>{{ title }}</h1>
<div class="toolbar">
  <button onclick="setAllSectionsOpen(true)">Expand all</button>
  <button onclick="setAllSectionsOpen(false)">Collapse all</button>
</div>
</header>
<main>
  {#- No field name for the report of the whole run, e.g. its error report #}
  {% if field_name is not none %}
  <p class="source">Source: <strong>{{ field_name }}</strong></p>
  {% endif %}

  {% for section in sections %}
  <details open><summary>{{ section.title }}</summary><div>
    {% include section.template %}
  </div></details>
  {% endfor %}
</main>
<script>
{% include "qa_metric.js" %}
</script>
</body>
</html>
